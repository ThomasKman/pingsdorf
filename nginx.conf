server {
    listen       8080;
    listen       [::]:8080;
    server_name  _;

    # Where the built SPA lives (matches Dockerfile COPY target).
    root   /usr/share/nginx/html;
    index  index.html;

    # Reasonable defaults
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout  65;
    server_tokens off;

    # Gzip compression for text-based assets
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types
        text/plain
        text/css
        text/javascript
        application/javascript
        application/json
        application/xml
        application/xml+rss
        image/svg+xml
        font/ttf
        font/otf
        font/woff
        font/woff2;

    # Long-lived caching for Vite's hashed assets (file names contain a hash).
    location /assets/ {
        access_log off;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Never cache the HTML entry point — it bootstraps the hashed assets.
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    # SPA fallback: anything that doesn't map to a real file falls back to index.html.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Basic hardening: deny dotfiles (e.g. .env, .git) just in case any sneak in.
    location ~ /\.(?!well-known) {
        deny all;
    }
}
